name: capture-site

on:
  workflow_dispatch:
  push:
    paths:
      - '.capture/trigger'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Find Chrome
        run: |
          which google-chrome || which chromium-browser || which chromium || true
          google-chrome --version || true

      - name: Capture
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p capture
          node tools/capture.mjs 2>&1 | tee runlog.txt
          echo "capture exit: ${PIPESTATUS[0]}" | tee -a runlog.txt

      - name: Commit
        if: always()
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add -f capture runlog.txt
          git commit -m "chore(capture): umamusume.com html + css [skip ci]" || echo "nothing to commit"
          git push
