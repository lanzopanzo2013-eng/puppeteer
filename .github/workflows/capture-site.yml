name: capture-site

on:
  workflow_dispatch:
  push:
    paths:
      - '.capture/trigger'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1; npm i puppeteer-core@23 --no-audit --no-fund

      - name: Find Chrome
        run: |
          which google-chrome || which chromium-browser || which chromium || true
          google-chrome --version || true

      - name: Capture
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/capture.mjs

      - name: Commit
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add -f capture
          git commit -m "chore(capture): umamusume.com html + css [skip ci]" || echo "nothing to commit"
          git push
