<!--
  @uma_enjoyer — Janitor AI profile "About Me"
  Rebuilt from umamusume.com · BATCH 0 + 1 + 2 (shell, top bar, hero, promo, socials)

  PASTE TARGET
    • whole file  → CSS + HTML panels both accept it, or About Me "Show Editor"
    • style block → CSS panel
    • body markup → HTML panel

  IMAGES: Janitor strips CSS url(), so every image is an <img> layer.
  Replace the src="https://placehold.co/..." values with your File Garden links.
  Slots are marked  IMG:…  below.

  FORBIDDEN (do not add): <script>, <svg>, <button>, <label>, <input>, url(),
  var(), nesting, scroll-snap-*, place-items, column-gap, row-gap, mask-composite.
-->

<style>
/* ============================================================
   BATCH 0 — page reset
   Janitor wraps the bio in .profile-about-me inside .profile-page-flex.
   We neutralise its box so the design can go full-bleed.
   ============================================================ */
.profile-about-me {
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  padding: 0 !important;
  overflow: visible !important;
  width: 100% !important;
  max-width: 560px !important;
  margin: 0 auto !important;
}
.profile-page-flex { align-items: center !important; }
.profile-about-me > div { background: transparent !important; }

/* ============================================================
   BATCH 1 — design tokens as literals (var() is banned)
   blue    #0E5CFE      deep green #2E8B22   grass #58AC3C
   pink    #FF4FA8      purple     #8B72E8   sky   #48B4FF
   ink     #22262B      paper      #FFFFFF
   ============================================================ */

/* ---- shell ---- */
.uma-shell {
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #22262B;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: #58AC3C;
  overflow: hidden;
  position: relative;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}
.uma-shell *, .uma-shell *::before, .uma-shell *::after { box-sizing: border-box; }
.uma-shell a { text-decoration: none !important; color: inherit !important; }
.uma-shell img { display: block; max-width: 100%; border: 0; }

/* ---- top bar ------------------------------------------------ */
.uma-bar {
  height: 74px;
  background: #0E5CFE;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px 0 16px;
  position: relative;
  z-index: 5;
}
/* wordmark: falls back to type if IMG:LOGO is not set yet */
.uma-mark { display: flex; align-items: center; }
.uma-mark img { height: 46px; width: auto; }
.uma-mark-txt { display: flex; flex-direction: column; }
.uma-mark-txt .w1 {
  font-style: italic;
  font-weight: 900;
  font-size: 27px;
  letter-spacing: -1.1px;
  line-height: .95;
  color: #FFCF3F;
  text-shadow: 2px 2px 0 #C8341E, -1px -1px 0 #fff;
}
.uma-mark-txt .w2 {
  font-style: italic;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 2.4px;
  color: #fff;
  text-shadow: 1px 1px 0 #1B3FA8;
  padding-left: 2px;
}
/* menu (horseshoe) — CSS only, <svg> is stripped */
.uma-menu { display: flex; flex-direction: column; align-items: center; width: 46px; }
.uma-menu-ring {
  width: 26px; height: 26px;
  border: 6px solid #fff;
  border-bottom-color: transparent;
  border-radius: 50%;
  position: relative;
}
.uma-menu-ring::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -8px;
  width: 6px; height: 9px;
  margin-left: -3px;
  background: #fff;
  border-radius: 3px;
}
.uma-menu-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: .4px;
  color: #fff; margin-top: 6px;
}

/* ---- hero --------------------------------------------------- */
.uma-hero {
  position: relative;
  height: 452px;
  background: #8FD46A;
  overflow: hidden;
}
.uma-hero-art {
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 22%;
}
/* soft wash so white type stays legible over busy art */
.uma-hero-wash {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 210px;
  background: linear-gradient(180deg, rgba(46,139,34,0) 0%, rgba(30,120,26,.55) 55%, rgba(20,100,20,.85) 100%);
}
/* vertical side label */
.uma-side {
  position: absolute;
  right: 8px; top: 26px;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  text-shadow: 0 1px 3px rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 20px;
  padding: 12px 4px;
}
/* PLAY NOW! plate */
.uma-playnow {
  position: absolute;
  left: 14px; bottom: 176px;
  z-index: 3;
  font-style: italic;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: -.8px;
  color: #FFE24A;
  text-shadow: 3px 3px 0 #B4301A, -2px 2px 0 #B4301A, 0 -2px 0 #B4301A;
  transform: rotate(-3deg);
}
.uma-playnow span { color: #FF8FC8; }

/* CTA grid 2x2 (the store badges, repointed) */
.uma-cta {
  position: absolute;
  left: 12px; right: 12px; bottom: 12px;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}
.uma-btn {
  width: 48.6%;
  min-height: 52px;
  margin-bottom: 8px;
  border-radius: 11px;
  background: #101215;
  color: #fff !important;
  display: flex;
  align-items: center;
  padding: 0 10px;
  box-shadow: 0 3px 0 rgba(0,0,0,.28);
  transition: transform .12s ease, box-shadow .12s ease;
}
.uma-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,.28); }
.uma-btn-ico {
  width: 26px; height: 26px;
  border-radius: 6px;
  margin-right: 8px;
  flex: 0 0 26px;
  background: #fff;
  color: #101215;
  font-size: 13px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.uma-btn-ico.blue { background: #4EA8FF; color: #fff; }
.uma-btn-ico.green { background: #34C759; color: #fff; }
.uma-btn-ico.pink { background: #FF4FA8; color: #fff; }
.uma-btn-txt { display: flex; flex-direction: column; line-height: 1.05; }
.uma-btn-txt small {
  font-size: 8px;
  letter-spacing: .6px;
  text-transform: uppercase;
  opacity: .75;
  font-weight: 700;
}
.uma-btn-txt b { font-size: 14px; font-weight: 800; letter-spacing: -.2px; }

/* scroll cue */
.uma-scroll {
  position: absolute;
  right: 6px; bottom: 96px;
  z-index: 3;
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 2px;
  writing-mode: vertical-rl;
  opacity: .9;
}

/* ---- promo card (Cygames WebStore slot) --------------------- */
.uma-promo {
  background: #fff;
  margin: -1px 12px 0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  padding: 10px 12px;
  box-shadow: 0 2px 0 rgba(0,0,0,.12);
  position: relative;
  z-index: 4;
}
.uma-promo-ico {
  width: 42px; height: 42px;
  border-radius: 9px;
  margin-right: 10px;
  flex: 0 0 42px;
  background: linear-gradient(135deg, #6F7BFF, #B15CFF);
  color: #fff;
  font-weight: 900;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1;
}
.uma-promo-txt { flex: 1 1 auto; font-size: 13px; font-weight: 700; }
.uma-promo-txt small { display: block; font-size: 10px; font-weight: 600; color: #6A7078; }
.uma-promo-go { font-size: 18px; color: #9AA0A8; font-weight: 900; }

/* ---- socials ------------------------------------------------ */
.uma-social {
  background: #fff;
  margin: 8px 12px 0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 12px;
  box-shadow: 0 2px 0 rgba(0,0,0,.12);
}
.uma-social-lbl { font-size: 11px; font-weight: 800; font-style: italic; letter-spacing: .3px; }
.uma-social-row { display: flex; align-items: center; }
.uma-soc {
  width: 28px; height: 28px;
  border-radius: 50%;
  margin-left: 7px;
  background: #EFF1F4;
  color: #22262B;
  font-size: 12px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s ease, color .12s ease;
}
.uma-soc.x:hover { background: #111; color: #fff; }
.uma-soc.dc:hover { background: #5865F2; color: #fff; }
.uma-soc.yt:hover { background: #FF0033; color: #fff; }
.uma-soc.fb:hover { background: #1877F2; color: #fff; }

/* placeholder styling so the layout reads before assets exist */
.uma-ph {
  background: repeating-linear-gradient(135deg, #7FC65A, #7FC65A 12px, #74BC4F 12px, #74BC4F 24px);
}
</style>
