<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janitor preview — @uma_enjoyer</title>
<style>
  /* This file is ONLY the local harness. Nothing here ships to Janitor.
     It imitates the real profile DOM (class names from the JAI page breakdown)
     so src/bio.html can be judged in context. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #181818;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: #eee;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 99;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: #101114;
    border-bottom: 1px solid #24262b;
    font-size: 12px;
  }
  .toolbar b { color: #9ad; letter-spacing: .4px; }
  .toolbar button {
    background: #1d2026; color: #cfd3da; border: 1px solid #2c3037;
    border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer;
  }
  .toolbar button:hover { background: #262a31; }
  .toolbar .spacer { flex: 1; }
  .toolbar small { color: #6f7681; }

  #root { background: #181818; min-height: 100vh; padding-bottom: 60px; }
  .profile-page-container { padding-top: 12px; }
  .profile-page-flex {
    display: flex; flex-direction: column; align-items: center;
  }

  /* fake profile chrome, styled like Janitor defaults */
  .profile-top-bar {
    width: 100%; height: 48px; background: #1f2127;
    display: flex; align-items: center; padding: 0 16px;
    font-size: 12px; color: #8d939c; border-bottom: 1px solid #262a31;
  }
  .profile-info-hstack {
    display: flex; align-items: center; width: 100%; max-width: 560px;
    padding: 16px; gap: 12px;
  }
  .profile-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7bc4, #6f7bff);
  }
  .profile-name { font-size: 18px; font-weight: 700; }
  .profile-name small { display: block; font-size: 12px; color: #8d939c; font-weight: 400; }

  /* the bio box, Janitor default look (padding + card bg) */
  .profile-about-me {
    width: 100%; max-width: 560px;
    background: #22242a;
    border: 1px solid #2c2f36;
    border-radius: 12px;
    padding: 16px;
    margin: 8px 0 16px;
  }

  .profile-tabs {
    width: 100%; max-width: 560px; display: flex; gap: 18px;
    padding: 10px 16px; font-size: 13px; color: #9aa1ab;
    border-bottom: 1px solid #262a31; margin-bottom: 8px;
  }
  .profile-tabs b { color: #fff; border-bottom: 2px solid #f5a; padding-bottom: 8px; }

  .characters-list-container-flex {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    width: 100%; max-width: 560px; padding: 16px;
  }
  .fake-bot {
    background: #23262c; border-radius: 10px; height: 120px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #6f7681;
  }
</style>
<style>
  /* harness chrome only — Janitor lays its own header out */
  .pp-top-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .pp-top-bar-search { flex: 1; border-radius: 8px; padding: 6px 10px; font: 500 12px/1 Roboto, Arial, sans-serif; }
  .pp-top-bar-create-char { font: 700 12px/1 Roboto, Arial, sans-serif; border-radius: 8px; padding: 7px 10px; }
  .pp-top-bar-back-button { font-size: 18px; }
</style>
<style>
  /* Harness-only: real Roboto / Roboto Condensed so the screenshot matches an
     Android device. These @font-face rules are NOT part of src/bio.html —
     Janitor strips url(), so the profile relies on the device's own Roboto. */
  @font-face{font-family:Roboto;src:url(fonts/roboto-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
  @font-face{font-family:Roboto;src:url(fonts/roboto-latin-700-normal.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
  @font-face{font-family:Roboto;src:url(fonts/roboto-latin-900-normal.woff2) format("woff2");font-weight:900;font-style:normal;font-display:block}
  @font-face{font-family:"Roboto Condensed";src:url(fonts/roboto-condensed-latin-700-italic.woff2) format("woff2");font-weight:700;font-style:italic;font-display:block}
  @font-face{font-family:"Roboto Condensed";src:url(fonts/roboto-condensed-latin-900-italic.woff2) format("woff2");font-weight:900;font-style:italic;font-display:block}
  @font-face{font-family:"Roboto Condensed";src:url(fonts/roboto-condensed-latin-900-normal.woff2) format("woff2");font-weight:900;font-style:normal;font-display:block}
</style>
</head>
<body>

<div class="toolbar">
  <b>JANITOR HARNESS</b>
  <small>src/bio.html injected into .profile-about-me</small>
  <span class="spacer"></span>
  <button data-w="390">390 mobile</button>
  <button data-w="430">430</button>
  <button data-w="560">560</button>
  <button id="reload">Reload</button>
</div>

<div id="root" class="pp-page-background">
  <div class="pp-top-bar profile-top-bar">
    <div class="pp-top-bar-back-button">‹</div>
    <div class="pp-top-bar-logo profile-top-bar-logo">
      <div class="pp-top-bar-logo-name">JanitorAI</div>
      <div class="pp-top-bar-logo-sub-name">beta</div>
    </div>
    <div class="pp-top-bar-search">Search characters…</div>
    <div class="pp-top-bar-create-char">+ Create</div>
  </div>

  <div class="profile-page-container pp-uc-background">
    <div class="profile-page-flex">

      <div class="profile-info-hstack">
        <div class="pp-uc-avatar-container profile-avatar"></div>
        <div class="profile-name pp-uc-title">@uma_enjoyer<small class="pp-uc-followers-count">1,192 followers · Member since …</small></div>
      </div>

      <div class="pp-tabs-wrapper profile-tabs"><b class="pp-tabs-button active">Characters</b><span class="pp-tabs-button">Scripts</span><i class="pp-tabs-indicator"></i></div>

      <!-- ↓↓↓ Janitor injects the About Me HTML here ↓↓↓ -->
      <div class="profile-about-me" id="slot"></div>
      <!-- ↑↑↑ Janitor injects the About Me HTML here ↑↑↑ -->

      <div class="characters-list-container-flex">
        <div class="fake-bot pp-cc-wrapper">bot card<span class="pp-cc-name">name</span><span class="pp-cc-chats">0 chats</span></div>
        <div class="fake-bot pp-cc-wrapper">bot card<span class="pp-cc-name">name</span><span class="pp-cc-chats">0 chats</span></div>
        <div class="fake-bot pp-cc-wrapper">bot card<span class="pp-cc-name">name</span><span class="pp-cc-chats">0 chats</span></div>
        <div class="fake-bot pp-cc-wrapper">bot card<span class="pp-cc-name">name</span><span class="pp-cc-chats">0 chats</span></div>
      </div>

    </div>
  </div>
</div>

<script>
  const slot = document.getElementById('slot');

  async function load() {
    const res = await fetch('../src/bio.html?t=' + Date.now());
    let html = await res.text();
    // Harness-only: the sandbox has no internet, so swap the live CDN art for the
    // local crops before painting. The real file keeps the CDN URLs.
    const OFFLINE = {
      'banner_30320202': 'news1.jpg', 'announce_banner_3144': 'news2.jpg',
      'about_thumbnail': 'about.jpg',
      'gameplay_specialweek': 'play1.jpg', 'gameplay_silencesuzuka': 'play2.jpg',
      'gameplay_winningticket': 'play2.jpg', 'gameplay_image_1-1': 'media_b.jpg',
      'media_image': 'media_a.jpg',
      'media_a.jpg': 'media_a.jpg', 'media_b.jpg': 'media_b.jpg',
      'badge-steam.png': '../assets/site/badge-steam.png',
      'badge-appstore.png': '../assets/site/badge-appstore.png',
      'badge-googleplaygames.png': '../assets/site/badge-googleplaygames.png',
      'badge-googleplay.png': '../assets/site/badge-googleplay.png',
      'logo.png': '../assets/site/logo.png', 'hero.jpg': '../assets/site/hero.jpg',
      'slide1.jpg': '../assets/site/slide1.jpg', 'slide2.jpg': '../assets/site/slide2.jpg',
      'news1.jpg': '../assets/site/news1.jpg', 'news2.jpg': '../assets/site/news2.jpg',
      'news3.jpg': '../assets/site/news3.jpg',
      'about_bg.jpg': '../assets/site/about_bg.jpg',
      'arrow_left.png': '../assets/site/arrow_left.png',
      'arrow_right.png': '../assets/site/arrow_right.png',
      'pager.png': '../assets/site/pager.png',
      'pager_1.png': '../assets/site/pager_1.png',
      'pager_2.png': '../assets/site/pager_2.png',
      'pager_3.png': '../assets/site/pager_3.png',
      'pfp.jpg': '../assets/site/pfp.jpg',
      'title_anime.png': '../assets/site/title_anime.png',
      'title_music.png': '../assets/site/title_music.png',
      'pattern.png': '../assets/site/pattern.png',
      'sns-x.png': '../assets/site/sns-x.png',
      'sns-facebook.png': '../assets/site/sns-facebook.png',
      'sns-youtube.png': '../assets/site/sns-youtube.png',
      'sns-discord.png': '../assets/site/sns-discord.png',
      'page_bg.jpg': '../assets/site/page_bg.jpg',
      'astonmachan': 'char_1.jpg', 'mrcb': 'char_2.jpg', 'tamamocross': 'char_3.jpg',
      'nicenature': 'char_4.jpg', 'winningticket': 'char_5.jpg'
    };
    html = html.replace(/url\((["']?)(https:\/\/cdn\.jsdelivr\.net\/gh\/lanzopanzo2013-eng\/puppeteer@[0-9a-f]+\/uma-profile\/assets\/site\/([^"')]+))\1\)/g,
      (m, q, full, file) => 'url("../assets/site/' + file + '")');
    html = html.replace(/(src=")([^"]+)(")/g, (m, a, url, c) => {
      const hit = Object.keys(OFFLINE).find(k => url.indexOf(k) > -1);
      if (!hit) return m;                      // unknown art: leave it to 404
      const target = OFFLINE[hit].startsWith('../') ? OFFLINE[hit] : '../assets/tmp/' + OFFLINE[hit];
      return a + target + c;
    });
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // move <style> + markup in, exactly like pasting the whole file into the editor
    slot.innerHTML = '';
    doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => slot.appendChild(n.cloneNode(true)));
    doc.body.childNodes.forEach(n => slot.appendChild(n.cloneNode(true)));
  }

  document.querySelectorAll('[data-w]').forEach(b => {
    b.onclick = () => {
      document.documentElement.style.setProperty('--w', b.dataset.w + 'px');
      document.getElementById('root').style.maxWidth = b.dataset.w + 'px';
      document.getElementById('root').style.margin = '0 auto';
      document.body.style.background = '#101114';
    };
  });
  document.getElementById('reload').onclick = load;

  load();
</script>
</body>
</html>
